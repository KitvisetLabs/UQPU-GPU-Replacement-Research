[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uqpu-prototype"
version = "0.3.0"
description = "Research prototype for a Universal Quantum Processing Unit semantic compiler and cost estimator"
requires-python = ">=3.10"
authors = [{name = "Kanutsanan Pongpanna"}]
license = {text = "Apache-2.0"}

[project.scripts]
uqpu = "uqpu.cli:main"

[tool.setuptools.packages.find]
include = ["uqpu*"]
