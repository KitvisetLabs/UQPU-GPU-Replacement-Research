name: UQPU Prototype and Project Invariants

on:
  push:
    paths:
      - "software/uqpu-prototype/**"
      - "PROJECT_CHARTER.md"
      - "STRATEGIC_PLAN_REFERENCES.md"
      - "docs/KANUSANAN_PONGPANNA_MODEL.md"
      - "docs/RESEARCH_OPERATING_SYSTEM.md"
      - "README.md"
      - "VERSION_INVARIANTS.md"
      - "GOALS.md"
      - "docs/CLOUD_COMPATIBILITY.md"
      - ".github/workflows/uqpu-tests.yml"
  pull_request:
    paths:
      - "software/uqpu-prototype/**"
      - "PROJECT_CHARTER.md"
      - "VERSION_INVARIANTS.md"
      - "GOALS.md"
      - "docs/CLOUD_COMPATIBILITY.md"
      - ".github/workflows/uqpu-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install prototype
        working-directory: software/uqpu-prototype
        run: python -m pip install -e .

      - name: Run unit and invariant tests
        working-directory: software/uqpu-prototype
        run: python -m unittest discover -s tests -v

      - name: Run CLI smoke test
        working-directory: software/uqpu-prototype
        run: python -m uqpu.cli compile examples/search_workload.json

      - name: Run synthetic finite-shot sensitivity
        if: matrix.python-version == '3.12'
        working-directory: software/uqpu-prototype
        run: python examples/run_noise_sensitivity.py

  reference-benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install prototype
        working-directory: software/uqpu-prototype
        run: python -m pip install -e .

      - name: Install pinned benchmark dependency
        working-directory: software/uqpu-prototype
        run: python -m pip install -r benchmark-optional-requirements.txt

      - name: Run controlled small and medium reference benchmarks
        working-directory: software/uqpu-prototype
        run: python examples/run_reference_benchmark.py

  qiskit-verification:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install prototype and pinned independent SDK
        working-directory: software/uqpu-prototype
        run: |
          python -m pip install -e .
          python -m pip install -r verification-optional-requirements.txt

      - name: Test SDK readout decoding
        working-directory: software/uqpu-prototype
        run: python -m unittest discover -s tests -p test_sdk_verification.py -v

      - name: Cross-check QASM and synthetic routing
        working-directory: software/uqpu-prototype
        run: python examples/run_qiskit_crosscheck.py --output /tmp/uqpu-qiskit-crosscheck.json

  target-snapshot-noise:
    runs-on: ubuntu-latest
    needs: qiskit-verification
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install prototype and pinned target-noise SDKs
        working-directory: software/uqpu-prototype
        run: |
          python -m pip install -e .
          python -m pip install -r target-noise-optional-requirements.txt

      - name: Run IBM snapshot-derived noisy simulation
        working-directory: software/uqpu-prototype
        run: |
          python examples/run_target_snapshot_noise.py --output /tmp/uqpu-target-snapshot-noise.json --shots 4096
          cat /tmp/uqpu-target-snapshot-noise.json
